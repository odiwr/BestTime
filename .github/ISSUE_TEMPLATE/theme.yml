name: Theme
description: Share a theme, or request one.
title: "Theme: "
labels: [theme, good first issue]
body:
  - type: markdown
    attributes:
      value: |
        A theme is one CSS file of custom properties and needs no JavaScript.
        Copy `themes/default.css`, change the values, open a PR.

  - type: input
    id: name
    attributes:
      label: Theme name
    validations:
      required: true

  - type: textarea
    id: css
    attributes:
      label: The variables
      render: css

  - type: textarea
    id: shot
    attributes:
      label: Screenshot
      description: Drag an image in.
